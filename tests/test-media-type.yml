name: Test custom mediaType input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          route: GET /zen
          mediaType: |
            format: raw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert status is 200
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected status 200, got '$STATUS'"
            exit 1
          fi
          echo "PASS: status is 200"
      - name: Assert data is non-empty
        env:
          DATA: ${{ steps.action.outputs.data }}
        run: |
          echo "data: $DATA"
          if [ -z "$DATA" ]; then
            echo "FAIL: expected non-empty data from /zen with custom mediaType"
            exit 1
          fi
          echo "PASS: data is non-empty"
