name: Test JSON response from public endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          route: GET /meta
      - name: Assert action ran and produced expected outputs
        env:
          STATUS: ${{ steps.action.outputs.status }}
          DATA: ${{ steps.action.outputs.data }}
          HEADERS: ${{ steps.action.outputs.headers }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          echo "data (truncated): ${DATA:0:200}"
          echo "headers (truncated): ${HEADERS:0:200}"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: expected status 200, got '$STATUS'"
              exit 1
            fi
            if [ -z "$DATA" ]; then
              echo "FAIL: expected non-empty data from /meta"
              exit 1
            fi
            # Verify it's parseable JSON with expected fields
            if ! echo "$DATA" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'verifiable_password_authentication' in d or 'hooks' in d or 'api' in d" 2>/dev/null; then
              echo "FAIL: data is not valid JSON or missing expected fields"
              exit 1
            fi
            if [ -z "$HEADERS" ]; then
              echo "FAIL: expected non-empty headers"
              exit 1
            fi
            # Headers should be a JSON object with lower-cased keys
            if ! echo "$HEADERS" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'content-type' in d" 2>/dev/null; then
              echo "FAIL: headers missing content-type or not valid JSON"
              exit 1
            fi
            echo "PASS: status=$STATUS, valid JSON data and headers with content-type"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
